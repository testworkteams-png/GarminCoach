name: Build Android APK

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Prepare web bundle (www)
        run: |
          mkdir -p www
          cp index.html styles.css theme-engine.js ai-insights.js app.js manifest.json icon.svg sw.js www/

      - name: Install npm dependencies
        run: npm install

      - name: Add Android Capacitor platform
        run: npx cap add android

      - name: Add Android permissions to AndroidManifest.xml
        run: |
          python3 - <<'PY'
          from pathlib import Path
          manifest_path = Path("android/app/src/main/AndroidManifest.xml")
          xml = manifest_path.read_text(encoding="utf-8")
          perms = [
              "android.permission.POST_NOTIFICATIONS",
              "android.permission.SCHEDULE_EXACT_ALARM",
              "android.permission.RECEIVE_BOOT_COMPLETED",
              "android.permission.ACCESS_COARSE_LOCATION",
              "android.permission.ACCESS_FINE_LOCATION",
          ]
          missing = [
              f'    <uses-permission android:name="{p}" />'
              for p in perms
              if p not in xml
          ]
          if missing:
              block = "\n".join(missing) + "\n\n    <application"
              if "    <application" in xml:
                  xml = xml.replace("    <application", block, 1)
              else:
                  xml = xml.replace("<application", "\n".join(missing) + "\n<application", 1)
              manifest_path.write_text(xml, encoding="utf-8")
          print(manifest_path.read_text(encoding="utf-8"))
          PY

      - name: Sync Capacitor Android
        run: npx cap sync android

      - name: Build Debug APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Copy APK artifact
        run: |
          cp android/app/build/outputs/apk/debug/app-debug.apk GarminCoach-Pro.apk
          ls -lh GarminCoach-Pro.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: GarminCoach-Pro-APK
          path: GarminCoach-Pro.apk
          retention-days: 14
